<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamster Pou 3D: Realistic</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', sans-serif; }
    body { background: #111; overflow: hidden; height: 100vh; width: 100vw; color: #fff; }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }

    .ui-layer { position: absolute; z-index: 10; width: 100%; pointer-events: none; }
    .top-bar { top: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent); }
    .badge { background: rgba(25,25,32,0.85); padding: 5px 12px; border-radius: 15px; font-weight: bold; color: #ffd166; border: 1px solid rgba(244,162,97,0.5); pointer-events: auto; font-size: 13px; }
    .music-box { display: flex; gap: 6px; align-items: center; pointer-events: auto; background: rgba(25,25,32,0.85); padding: 4px 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); font-size: 12px; }
    .music-box button { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }

    .stats-container { top: 48px; display: flex; justify-content: center; gap: 6px; padding: 0 10px; }
    .stat-bar { background: rgba(18,18,24,0.75); backdrop-filter: blur(4px); padding: 5px 7px; border-radius: 9px; font-size: 10px; width: 23%; border: 1px solid rgba(255,255,255,0.15); }
    .bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: #52b788; transition: width 0.3s; }

    .bottom-panel { bottom: 0; background: rgba(18,18,24,0.92); border-top: 1px solid rgba(255,255,255,0.15); padding: 10px; pointer-events: auto; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); }
    .controls-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .controls-scroll::-webkit-scrollbar { height: 4px; }
    .controls-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

    .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: #fff; padding: 8px 11px; border-radius: 11px; white-space: nowrap; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 86px; }
    .btn:active { transform: scale(0.95); }
    .btn.active { border-color: #52b788; background: rgba(82,183,136,0.22); }

    .nav-tabs { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid rgba(255,255,255,0.12); padding-top: 8px; gap: 4px; }
    .nav-btn { background: none; border: none; color: #9ca3af; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nav-btn.active { color: #ffd166; font-weight: bold; }
    .nav-btn span { font-size: 18px; }

    #toast { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); background: rgba(15,15,20,0.92); border: 1px solid #f4a261; padding: 7px 14px; border-radius: 20px; font-size: 12px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 25; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-layer top-bar">
    <div class="badge">🪙 <span id="ui-coins">100</span></div>
    <div class="badge" id="ui-room-title">🛋️ Гостиная</div>
    <div class="music-box">
      <button onclick="prevTrack()">⏮</button>
      <button id="playBtn" onclick="toggleMusic()">▶️</button>
      <button onclick="nextTrack()">⏭</button>
      <span id="trackLabel">lofi1</span>
    </div>
  </div>

  <div class="ui-layer stats-container">
    <div class="stat-bar">🍔 Сытость<div class="bar-bg"><div class="bar-fill" id="bar-hunger"></div></div></div>
    <div class="stat-bar">⚡ Бодрость<div class="bar-bg"><div class="bar-fill" id="bar-energy"></div></div></div>
    <div class="stat-bar">🧼 Чистота<div class="bar-bg"><div class="bar-fill" id="bar-clean"></div></div></div>
    <div class="stat-bar">💜 Кайф<div class="bar-bg"><div class="bar-fill" id="bar-fun"></div></div></div>
  </div>

  <div id="toast"></div>

  <div class="ui-layer bottom-panel">
    <div class="controls-scroll" id="action-panel"></div>
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchRoom('living', this)"><span>🛋️</span>Гостиная</button>
      <button class="nav-btn" onclick="switchRoom('kitchen', this)"><span>🍔</span>Кухня</button>
      <button class="nav-btn" onclick="switchRoom('banya', this)"><span>🧖</span>Баня</button>
      <button class="nav-btn" onclick="switchRoom('bedroom', this)"><span>🛏️</span>Спальня</button>
      <button class="nav-btn" onclick="switchRoom('studio', this)"><span>🎥</span>Блогинг</button>
      <button class="nav-btn" onclick="switchRoom('football', this)"><span>⚽</span>Футбол</button>
    </div>
  </div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // ==========================================
  // 1. СОСТОЯНИЕ И КАТАЛОГИ
  // ==========================================
  let state = JSON.parse(localStorage.getItem('hamster3d_v2')) || {
    coins: 100,
    hunger: 80,
    energy: 85,
    clean: 75,
    fun: 90,
    skin: 'classic_suit', // Сразу в пиджаке с фото!
    ownedSkins: ['classic_suit', 'naked'],
    hair: 'default',
    banyaTemp: 85,
    sleeping: false
  };

  const SKINS = [
    { id: 'classic_suit', name: 'Пиджак (с фото)', price: 0 },
    { id: 'naked', name: 'Без пиджака', price: 0 },
    { id: 'cap', name: 'Кепка', price: 15 },
    { id: 'paris', name: 'Paris', price: 35 },
    { id: 'profimatika', name: 'Профиматика', price: 45 },
    { id: 'ronaldo', name: 'Роналду #7', price: 65 },
    { id: 'riana_bulat', name: 'Риана+Булат', price: 80 },
    { id: 'bzelk', name: 'bzelk + Цепь', price: 150 },
    { id: 'business_suit', name: 'VIP Чёрный', price: 350 },
    { id: 'brown_tux', name: 'Смокинг', price: 550 }
  ];

  const FOODS = [
    { id: 'air', name: '💨 Воздух', price: 0, h: 0, e: 0 },
    { id: 'cheese', name: '🥪 Бутер', price: 2, h: 14, e: 2 },
    { id: 'jelly', name: '🍏 Желе', price: 3, h: 16, e: 4 },
    { id: 'pasta', name: '🍝 Паста', price: 4, h: 24, e: 5 },
    { id: 'borsch', name: '🍲 Борщ', price: 5, h: 30, e: 8 },
    { id: 'burger', name: '🍔 Бургер', price: 6, h: 35, e: 5 },
    { id: 'pizza', name: '🍕 Пицца', price: 7, h: 40, e: 6 },
    { id: 'shavuha', name: '🌯 Шавуха', price: 8, h: 50, e: 8 },
    { id: 'cola', name: '🥤 Кола', price: 4, h: 5, e: 22 },
    { id: 'adrenaline', name: '⚡ Адреналин', price: 6, h: 2, e: 42 },
    { id: 'monster', name: '🔋 Монстер', price: 7, h: 2, e: 55 }
  ];

  function saveState() {
    localStorage.setItem('hamster3d_v2', JSON.stringify(state));
    updateUI();
  }

  function updateUI() {
    document.getElementById('ui-coins').innerText = Math.floor(state.coins);
    document.getElementById('bar-hunger').style.width = state.hunger + '%';
    document.getElementById('bar-energy').style.width = state.energy + '%';
    document.getElementById('bar-clean').style.width = state.clean + '%';
    document.getElementById('bar-fun').style.width = state.fun + '%';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.opacity = 1;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.opacity = 0, 2000);
  }

  // ==========================================
  // 2. LO-FI ПЛЕЕР
  // ==========================================
  const tracks = ['lofi1.mp3', 'lofi2.mp3', 'lofi3.mp3'];
  let trackIdx = 0, musicOn = false;
  const audio = new Audio();
  audio.loop = true;

  function toggleMusic() {
    musicOn = !musicOn;
    document.getElementById('playBtn').innerText = musicOn ? '⏸' : '▶️';
    if (musicOn) {
      audio.src = `./music/${tracks[trackIdx]}`;
      audio.play().catch(() => showToast('Загрузи треки в папку music/'));
    } else {
      audio.pause();
    }
  }
  function prevTrack() { trackIdx = (trackIdx + 2) % 3; document.getElementById('trackLabel').innerText = 'lofi' + (trackIdx + 1); if (musicOn) { audio.src = `./music/${tracks[trackIdx]}`; audio.play().catch(()=>{}); } }
  function nextTrack() { trackIdx = (trackIdx + 1) % 3; document.getElementById('trackLabel').innerText = 'lofi' + (trackIdx + 1); if (musicOn) { audio.src = `./music/${tracks[trackIdx]}`; audio.play().catch(()=>{}); } }

  // ==========================================
  // 3. THREE.JS СЦЕНА И ОСВЕЩЕНИЕ
  // ==========================================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x231b30);

  const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 3.6, 10.5);
  camera.lookAt(0, 2.3, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xfff5e4, 0.95);
  dirLight.position.set(5, 11, 8);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  // ==========================================
  // 4. РЕАЛИСТИЧНАЯ 3D-МОДЕЛЬ ХОМЯКА (КАК НА ФОТО)
  // ==========================================
  const hamsterGroup = new THREE.Group();
  scene.add(hamsterGroup);

  const furMat = new THREE.MeshStandardMaterial({ color: 0xdd852c, roughness: 0.75 });
  const whiteFurMat = new THREE.MeshStandardMaterial({ color: 0xfbf7f0, roughness: 0.85 });
  const earOutMat = new THREE.MeshStandardMaterial({ color: 0x5c4438, roughness: 0.8 });
  const earInMat = new THREE.MeshStandardMaterial({ color: 0xd8a798, roughness: 0.8 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5cbb6, roughness: 0.6 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.08, metalness: 0.2 });
  const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xf08c96, roughness: 0.4 });

  // Туловище (Y: 0.3 .. 2.3)
  const torso = new THREE.Mesh(new THREE.SphereGeometry(1.35, 32, 32), furMat);
  torso.scale.set(1.05, 1.15, 0.95);
  torso.position.set(0, 1.35, 0);
  torso.castShadow = true;
  hamsterGroup.add(torso);

  // Белый животик
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1.05, 32, 32), whiteFurMat);
  belly.scale.set(0.95, 1.05, 0.6);
  belly.position.set(0, 1.35, 0.65);
  hamsterGroup.add(belly);

  // Лапки нижние и передние
  [-0.65, 0.65].forEach(x => {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), skinMat);
    foot.scale.set(1, 0.55, 1.3);
    foot.position.set(x, 0.16, 0.45);
    foot.castShadow = true;
    hamsterGroup.add(foot);

    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), skinMat);
    hand.scale.set(0.9, 1.1, 0.8);
    hand.position.set(x * 2.1, 1.1, 0.7);
    hand.castShadow = true;
    hamsterGroup.add(hand);
  });

  // Голова (отдельно от туловища, Y: 3.15)
  const headGroup = new THREE.Group();
  headGroup.position.set(0, 3.15, 0.1);
  hamsterGroup.add(headGroup);

  const headMain = new THREE.Mesh(new THREE.SphereGeometry(1.18, 32, 32), furMat);
  headMain.scale.set(1.12, 0.96, 1.02);
  headMain.castShadow = true;
  headGroup.add(headMain);

  // Белая полоска от лба к мордочке (как на фото)
  const faceStripe = new THREE.Mesh(new THREE.SphereGeometry(0.65, 24, 24), whiteFurMat);
  faceStripe.scale.set(0.85, 1.25, 0.55);
  faceStripe.position.set(0, -0.05, 0.82);
  headGroup.add(faceStripe);

  // Пухлые белые щёки по бокам
  const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.68, 24, 24), whiteFurMat);
  cheekL.scale.set(1.18, 0.92, 0.95);
  cheekL.position.set(-0.78, -0.28, 0.55);
  headGroup.add(cheekL);

  const cheekR = new THREE.Mesh(new THREE.SphereGeometry(0.68, 24, 24), whiteFurMat);
  cheekR.scale.set(1.18, 0.92, 0.95);
  cheekR.position.set(0.78, -0.28, 0.55);
  headGroup.add(cheekR);

  // Уши с розовой серединкой
  [-0.95, 0.95].forEach((x, idx) => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 20), earOutMat);
    ear.scale.set(0.95, 1.15, 0.35);
    ear.position.set(x, 0.92, -0.05);
    ear.rotation.z = idx === 0 ? 0.35 : -0.35;
    ear.castShadow = true;
    headGroup.add(ear);

    const earIn = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), earInMat);
    earIn.scale.set(0.9, 1.1, 0.3);
    earIn.position.set(x * 0.98, 0.9, 0.04);
    earIn.rotation.z = idx === 0 ? 0.35 : -0.35;
    headGroup.add(earIn);
  });

  // Глаза-бусинки с белыми бликами (широко посаженные, как на фото)
  [-0.52, 0.52].forEach(x => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), eyeMat);
    eye.position.set(x, 0.22, 1.06);
    headGroup.add(eye);

    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), glintMat);
    glint.position.set(x - 0.04, 0.27, 1.2);
    headGroup.add(glint);
  });

  // Розовый носик
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), noseMat);
  nose.scale.set(1.25, 0.9, 0.9);
  nose.position.set(0, -0.04, 1.22);
  headGroup.add(nose);

  // Тонкие белые усики
  const whiskerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  [-1, 1].forEach(dir => {
    for (let i = -1; i <= 1; i++) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.004, 0.85, 6), whiskerMat);
      w.position.set(dir * 1.15, -0.18 + i * 0.08, 0.95);
      w.rotation.z = dir * (Math.PI / 2 + i * 0.14);
      headGroup.add(w);
    }
  });

  // ==========================================
  // 5. ОДЕЖДА И ПИДЖАК С ФОТО (3D ДЕТАЛИ)
  // ==========================================
  const clothesGroup = new THREE.Group();
  hamsterGroup.add(clothesGroup);
  const headAccGroup = new THREE.Group();
  headGroup.add(headAccGroup);

  function makeShirtTexture(title, sub, bg, fg) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 512, 256);
    ctx.fillStyle = fg;
    ctx.font = 'bold 46px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title, 256, 120);
    if (sub) {
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText(sub, 256, 175);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.offset.x = -0.25;
    return tex;
  }

  function applySkin() {
    clothesGroup.clear();
    headAccGroup.clear();
    const s = state.skin;
    if (s === 'naked') return;

    if (s === 'cap') {
      const crown = new THREE.Mesh(new THREE.SphereGeometry(1.08, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.45), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
      crown.position.set(0, 0.25, 0);
      const visor = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.08, 20, 1, false, -0.9, 1.8), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
      visor.position.set(0, 0.65, 0.65);
      headAccGroup.add(crown, visor);
      return;
    }

    // Классический синий пиджак, белая рубашка и коричневый галстук (КАК НА ФОТО!)
    if (s === 'classic_suit' || s === 'business_suit' || s === 'brown_tux') {
      const jacketColor = s === 'classic_suit' ? 0x1e3552 : (s === 'business_suit' ? 0x18181b : 0x4a2c18);
      const tieColor = s === 'classic_suit' ? 0x7c3a19 : (s === 'business_suit' ? 0xb91c1c : 0xd97706);

      // Пиджак по форме тела
      const jacket = new THREE.Mesh(new THREE.SphereGeometry(1.42, 32, 32), new THREE.MeshStandardMaterial({ color: jacketColor, roughness: 0.7 }));
      jacket.scale.set(1.06, 1.08, 0.98);
      jacket.position.set(0, 1.32, 0);
      jacket.castShadow = true;
      clothesGroup.add(jacket);

      // Белая рубашка V-вырез
      const shirt = new THREE.Mesh(new THREE.ConeGeometry(0.68, 1.35, 4), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
      shirt.rotation.x = Math.PI;
      shirt.rotation.y = Math.PI / 4;
      shirt.position.set(0, 1.65, 1.15);
      clothesGroup.add(shirt);

      // Коричневый галстук (узел + полотно)
      const knot = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.16), new THREE.MeshStandardMaterial({ color: tieColor }));
      knot.position.set(0, 2.02, 1.34);
      const tieBody = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.88, 0.12), new THREE.MeshStandardMaterial({ color: tieColor }));
      tieBody.position.set(0, 1.52, 1.36);
      tieBody.rotation.x = -0.14;
      clothesGroup.add(knot, tieBody);

      // Пуговица пиджака внизу
      const btnMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      btnMesh.rotation.x = Math.PI / 2;
      btnMesh.position.set(0, 0.85, 1.35);
      clothesGroup.add(btnMesh);
      return;
    }

    // Футболки и кофты на туловище
    let mat;
    if (s === 'paris') mat = new THREE.MeshStandardMaterial({ map: makeShirtTexture('PARIS', '🗼', '#18181b', '#ffffff') });
    if (s === 'profimatika') mat = new THREE.MeshStandardMaterial({ map: makeShirtTexture('ПРОФИМАТИКА', '∑ π √x', '#1d4ed8', '#ffffff') });
    if (s === 'ronaldo') mat = new THREE.MeshStandardMaterial({ map: makeShirtTexture('RONALDO', '7', '#b91c1c', '#fde047') });
    if (s === 'riana_bulat') mat = new THREE.MeshStandardMaterial({ map: makeShirtTexture('Риана + Булат', '❤️ 💖 ❤️', '#ffffff', '#e11d48') });
    if (s === 'bzelk') {
      mat = new THREE.MeshStandardMaterial({ map: makeShirtTexture('bzelk', '★ 3D ★', '#0f172a', '#38bdf8') });
      // Очки и золотая цепь
      const glassL = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.28, 0.12), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 }));
      glassL.position.set(-0.52, 0.22, 1.18);
      const glassR = glassL.clone();
      glassR.position.x = 0.52;
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.1), new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
      bridge.position.set(0, 0.25, 1.18);
      headAccGroup.add(glassL, glassR, bridge);

      const chain = new THREE.Mesh(new THREE.TorusGeometry(1.18, 0.08, 12, 32), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.85, roughness: 0.2 }));
      chain.position.set(0, 2.1, 0.15);
      chain.rotation.x = Math.PI / 2.3;
      clothesGroup.add(chain);
    }

    const shirtMesh = new THREE.Mesh(new THREE.SphereGeometry(1.41, 32, 32), mat);
    shirtMesh.scale.set(1.06, 1.08, 0.98);
    shirtMesh.position.set(0, 1.32, 0);
    shirtMesh.castShadow = true;
    clothesGroup.add(shirtMesh);
  }

  // ==========================================
  // 6. ПОЛНОЦЕННЫЕ 3D-ИНТЕРЬЕРЫ ВСЕХ КОМНАТ
  // ==========================================
  const roomGroup = new THREE.Group();
  scene.add(roomGroup);
  let currentRoom = 'living';

  function addBox(w, h, d, color, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.75 }));
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    roomGroup.add(m);
    return m;
  }

  function buildRoom(type) {
    roomGroup.clear();
    const titles = {
      living: '🛋️ Гостиная & Гардероб',
      kitchen: '🍔 Уютная Кухня',
      banya: '🧖 Русская Баня',
      bedroom: '🛏️ Lo-Fi Спальня',
      studio: '🎥 Студия Блогинга',
      football: '⚽ Выездной Стадион 11×11'
    };
    document.getElementById('ui-room-title').innerText = titles[type];

    // Общий пол и стены для комнат (кроме открытого стадиона)
    if (type !== 'football') {
