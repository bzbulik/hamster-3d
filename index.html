<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hamster Pou: Realistic</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: #111; color: #fff;
      display: flex; flex-direction: column;
    }

    /* ВЕРХНЯЯ ПАНЕЛЬ */
    .top-bar {
      position: relative; z-index: 25;
      background: rgba(14, 14, 19, 0.86);
      backdrop-filter: blur(10px);
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      display: flex; flex-direction: column; gap: 6px;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .badge {
      background: rgba(255, 209, 102, 0.16);
      border: 1px solid rgba(255, 209, 102, 0.45);
      color: #ffd166; padding: 4px 10px; border-radius: 14px;
      font-weight: 700; font-size: 13px;
    }
    .music-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08);
      padding: 3px 9px; border-radius: 14px; font-size: 12px;
    }
    .music-pill button { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat-card { background: rgba(255,255,255,0.07); padding: 4px 6px; border-radius: 8px; font-size: 10px; }
    .stat-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 3px; overflow: hidden; }
    .stat-fill { height: 100%; background: #52b788; transition: width 0.3s; }

    /* СЦЕНА КОМНАТЫ */
    .stage {
      flex: 1; position: relative;
      background-size: cover; background-position: center bottom; background-repeat: no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: 14px; transition: background-image 0.35s ease; overflow: hidden;
    }
    .stage::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 65px rgba(0,0,0,0.65);
    }

    /* ЭФФЕКТЫ АНИМАЦИЙ НА СЦЕНЕ */
    .sleep-dim {
      position: absolute; inset: 0; background: rgba(5, 6, 18, 0.74);
      opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 8;
    }
    .sleep-dim.active { opacity: 1; }

    /* Клубы пара в бане */
    .steam-fx {
      position: absolute; inset: 0; pointer-events: none; z-index: 12;
      background: radial-gradient(circle at 50% 75%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.35) 55%, transparent 85%);
      opacity: 0; animation: steamBurst 1.8s ease-out forwards;
    }
    @keyframes steamBurst {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      35% { opacity: 0.9; transform: translateY(0) scale(1.05); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.15); }
    }

    /* Вспышка камеры в студии */
    .flash-fx {
      position: absolute; inset: 0; background: #fff; z-index: 18; pointer-events: none;
      animation: cameraFlash 0.5s ease-out forwards;
    }
    @keyframes cameraFlash { 0% { opacity: 0.85; } 100% { opacity: 0; } }

    /* Плашка предпросмотра скина */
    .preview-banner {
      position: absolute; top: 12px; z-index: 22;
      background: rgba(15, 15, 22, 0.9); border: 1px solid #ffd166;
      padding: 6px 14px; border-radius: 20px; font-size: 12px;
      display: none; align-items: center; gap: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }
    .preview-banner.active { display: flex; }
    .preview-buy-btn {
      background: #52b788; color: #fff; border: none; padding: 4px 10px;
      border-radius: 12px; font-weight: bold; font-size: 12px; cursor: pointer;
    }

    /* КОНТЕЙНЕР ХОМЯКА */
    .hamster-box {
      position: relative; width: 255px; height: 275px; z-index: 6;
      cursor: pointer; display: flex; align-items: flex-end; justify-content: center;
      animation: breathe 3.2s ease-in-out infinite;
    }
    .hamster-box:active { transform: scale(0.95); }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.02) translateY(-3px); }
    }
    .hamster-shake { animation: shakeAnim 0.45s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }

    .floor-shadow {
      position: absolute; bottom: 4px; width: 175px; height: 26px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 72%);
      z-index: 1;
    }

    .hamster-photo {
      position: relative; z-index: 2; width: 100%; height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,0.65));
      transition: transform 0.25s ease;
    }

    /* Мыльная пена на хомяке */
    .soap-bubbles {
      position: absolute; inset: 15px; z-index: 10; pointer-events: none;
      display: none;
    }
    .soap-bubbles.active { display: block; }
    .bubble {
      position: absolute; background: radial-gradient(circle at 30% 30%, #ffffff, rgba(220,245,255,0.85));
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      animation: bubblePop 1.6s ease-in-out infinite alternate;
    }
    @keyframes bubblePop { from { transform: scale(0.9); } to { transform: scale(1.12); } }

    /* Летящая крупная еда и частицы */
    .big-food-fly {
      position: absolute; bottom: 35px; font-size: 76px; z-index: 15;
      pointer-events: none; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.65));
      animation: eatFly 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes eatFly {
      0% { transform: translateY(40px) scale(1.15); opacity: 1; }
      60% { transform: translateY(-75px) scale(0.95); opacity: 1; }
      100% { transform: translateY(-95px) scale(0.15); opacity: 0; }
    }

    .fx-particle {
      position: absolute; font-size: 30px; z-index: 16; pointer-events: none;
      animation: particleUp 1.1s ease-out forwards;
    }
    @keyframes particleUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-95px) scale(1.25); }
    }

    .float-msg {
      position: absolute; top: 20%; font-size: 16px; font-weight: 800;
      color: #ffd166; text-shadow: 0 2px 6px rgba(0,0,0,0.95);
      z-index: 22; pointer-events: none; animation: floatUp 1.1s ease-out forwards;
    }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-45px); } }

    /* НИЖНЕЕ МЕНЮ */
    .bottom-panel {
      position: relative; z-index: 25;
      background: rgba(14, 14, 19, 0.95);
      border-top: 1px solid rgba(255,255,255,0.14);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 8px;
    }
    .actions-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .actions-row::-webkit-scrollbar { display: none; }

    .act-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      color: #fff; border-radius: 12px; padding: 7px 10px; min-width: 92px;
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }
    .act-btn:active { transform: scale(0.95); }
    .act-btn.active { border-color: #52b788; background: rgba(82, 183, 136, 0.22); }
    .act-btn.previewing { border-color: #ffd166; background: rgba(255, 209, 102, 0.2); }
    .act-emoji { font-size: 28px; line-height: 1.1; }
    .act-title { font-size: 11px; font-weight: 600; }
    .act-price { font-size: 10px; color: #ffd166; }

    .nav-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
      border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px;
    }
    .nav-item {
      background: none; border: none; color: #9ca3af;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; cursor: pointer; padding: 3px 0;
    }
    .nav-item.active { color: #ffd166; font-weight: 700; }
    .nav-item span { font-size: 19px; }
  </style>
</head>
<body>

  <!-- ВЕРХ -->
  <div class="top-bar">
    <div class="top-row">
      <div class="badge">🪙 <span id="coinsVal">100</span></div>
      <div class="badge" id="roomBadge">🛋️ Гостиная</div>
      <div class="music-pill">
        <button onclick="prevTrack()">⏮</button>
        <button id="playBtn" onclick="toggleMusic()">▶️</button>
        <button onclick="nextTrack()">⏭</button>
        <span id="trackTxt">lofi1</span>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">🍔 Сытость <b id="txtH">80%</b><div class="stat-bar"><div id="barH" class="stat-fill"></div></div></div>
      <div class="stat-card">⚡ Бодрость <b id="txtE">85%</b><div class="stat-bar"><div id="barE" class="stat-fill"></div></div></div>
      <div class="stat-card">🧼 Чистота <b id="txtC">75%</b><div class="stat-bar"><div id="barC" class="stat-fill"></div></div></div>
      <div class="stat-card">💜 Кайф <b id="txtF">90%</b><div class="stat-bar"><div id="barF" class="stat-fill"></div></div></div>
    </div>
  </div>

  <!-- СЦЕНА -->
  <div id="stage" class="stage" style="background-image: url('bg_living.jpg'), linear-gradient(180deg, #2d3138, #1c1e22);">
    <div id="sleepDim" class="sleep-dim"></div>

    <!-- Баннер предпросмотра скина -->
    <div id="previewBanner" class="preview-banner">
      <span id="previewName">Примерка: Paris</span>
      <button id="previewActionBtn" class="preview-buy-btn" onclick="confirmSkinAction()">Купить</button>
    </div>

    <div id="hamsterBox" class="hamster-box" onclick="tapHamster()">
      <div class="floor-shadow"></div>
      <img id="hamsterImg" class="hamster-photo" src="skin_suit.png" alt="Хомяк">

      <!-- Мыльная пена при мытье -->
      <div id="soapBubbles" class="soap-bubbles">
        <div class="bubble" style="width:36px; height:36px; top:12px; left:85px;"></div>
        <div class="bubble" style="width:44px; height:44px; top:6px; left:112px;"></div>
        <div class="bubble" style="width:34px; height:34px; top:16px; left:144px;"></div>
        <div class="bubble" style="width:38px; height:38px; top:145px; left:65px;"></div>
        <div class="bubble" style="width:42px; height:42px; top:160px; left:110px;"></div>
        <div class="bubble" style="width:36px; height:36px; top:148px; left:155px;"></div>
      </div>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="bottom-panel">
    <div id="actionsRow" class="actions-row"></div>
    <div class="nav-grid">
      <button class="nav-item active" onclick="setRoom('living', this)"><span>🛋️</span>Гостиная</button>
      <button class="nav-item" onclick="setRoom('kitchen', this)"><span>🍔</span>Кухня</button>
      <button class="nav-item" onclick="setRoom('banya', this)"><span>🧖</span>Баня</button>
      <button class="nav-item" onclick="setRoom('bedroom', this)"><span>🛏️</span>Спальня</button>
      <button class="nav-item" onclick="setRoom('studio', this)"><span>🎥</span>Блогинг</button>
      <button class="nav-item" onclick="setRoom('football', this)"><span>⚽</span>Футбол</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    // ==========================================
    // 1. ЗВУКОВОЙ ДВИЖОК (Web Audio API)
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(type) {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const now = actx.currentTime;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);

        if (type === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'coin') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1318, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.24);
          osc.start(now); osc.stop(now + 0.24);
        } else if (type === 'eat') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(310, now + 0.09);
          osc.frequency.setValueAtTime(190, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.26);
          osc.start(now); osc.stop(now + 0.26);
        } else if (type === 'bubbles') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.22);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.23);
          osc.start(now); osc.stop(now + 0.23);
        } else if (type === 'steam') {
          // Белый шум для шипения пара на камнях
          const bufSize = actx.sampleRate * 0.6;
          const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = actx.createBufferSource();
          noise.buffer = buf;
          const nGain = actx.createGain();
          nGain.gain.setValueAtTime(0.15, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          noise.connect(nGain); nGain.connect(actx.destination);
          noise.start(now);
        } else if (type === 'camera') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(1100, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.07);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'whistle') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2400, now);
          osc.frequency.setValueAtTime(2650, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    // ==========================================
    // 2. СОСТОЯНИЕ И КАТАЛОГ СКИНОВ (КАЖДЫЙ СКИН = ОТДЕЛЬНЫЙ PNG)
    // ==========================================
    let state = JSON.parse(localStorage.getItem('hamster_real_v2')) || {
      coins: 100,
      hunger: 80,
      energy: 85,
      clean: 75,
      fun: 90,
      skin: 'suit',
      owned: ['suit', 'naked'],
      sleeping: false,
      temp: 85
    };

    const SKINS = [
      { id: 'suit', name: 'Пиджак (Фото)', file: 'skin_suit.png', icon: '👔', price: 0 },
      { id: 'naked', name: 'Голый хомяк', file: 'skin_naked.png', icon: '🐹', price: 0 },
      { id: 'cap', name: 'В кепке', file: 'skin_cap.png', icon: '🧢', price: 15 },
      { id: 'paris', name: 'Футболка Paris', file: 'skin_paris.png', icon: '🗼', price: 35 },
      { id: 'profimatika', name: 'Профиматика', file: 'skin_profimatika.png', icon: '📘', price: 45 },
      { id: 'ronaldo', name: 'Роналду #7', file: 'skin_ronaldo.png', icon: '🇵🇹', price: 65 },
      { id: 'riana_bulat', name: 'Риана + Булат', file: 'skin_riana_bulat.png', icon: '❤️', price: 80 },
      { id: 'bzelk', name: 'bzelk + Цепь', file: 'skin_bzelk.png', icon: '🕶️', price: 150 },
      { id: 'business', name: 'Деловой VIP', file: 'skin_business.png', icon: '💼', price: 300 },
      { id: 'tux', name: 'Коричн. смокинг', file: 'skin_tux.png', icon: '🎩', price: 500 }
    ];

    const FOODS = [
      { id: 'air', name: 'Воздух', icon: '💨', price: 0, h: 0, e: 0 },
      { id: 'cheese', name: 'Бутер с сыром', icon: '🥪', price: 2, h: 14, e: 2 },
      { id: 'jelly', name: 'Зелёное желе', icon: '🍏', price: 3, h: 16, e: 4 },
      { id: 'pasta', name: 'Паста', icon: '🍝', price: 4, h: 24, e: 5 },
      { id: 'borsch', name: 'Борщ', icon: '🍲', price: 5, h: 30, e: 8 },
      { id: 'burger', name: 'Бургер', icon: '🍔', price: 6, h: 35, e: 5 },
      { id: 'pizza', name: 'Пицца', icon: '🍕', price: 7, h: 40, e: 6 },
      { id: 'shavuha', name: 'Шавуха', icon: '🌯', price: 8, h: 50, e: 8 },
      { id: 'cola', name: 'Кока-Кола', icon: '🥤', price: 4, h: 5, e: 22 },
      { id: 'adrenaline', name: 'Адреналин', icon: '⚡', price: 6, h: 2, e: 42 },
      { id: 'monster', name: 'Монстер', icon: '🔋', price: 7, h: 2, e: 55 }
    ];

    let previewSkinId = null; // ID скина, который сейчас примеряем

    function save() {
      localStorage.setItem('hamster_real_v2', JSON.stringify(state));
      updateUI();
    }

    function updateUI() {
      document.getElementById('coinsVal').innerText = Math.floor(state.coins);
      const upd = (tId, bId, v) => {
        const val = Math.max(0, Math.min(100, Math.round(v)));
        document.getElementById(tId).innerText = val + '%';
        const b = document.getElementById(bId);
        b.style.width = val + '%';
        b.style.background = val > 45 ? '#52b788' : (val > 20 ? '#f4a261' : '#e76f51');
      };
      upd('txtH', 'barH', state.hunger);
      upd('txtE', 'barE', state.energy);
      upd('txtC', 'barC', state.clean);
      upd('txtF', 'barF', state.fun);
    }

    function floatText(txt) {
      const stage = document.getElementById('stage');
      const el = document.createElement('div');
      el.className = 'float-msg';
      el.innerText = txt;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }

    function spawnParticles(emoji, count = 6) {
      const stage = document.getElementById('stage');
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'fx-particle';
        p.innerText = emoji;
        p.style.left = (25 + Math.random() * 50) + '%';
        p.style.bottom = (20 + Math.random() * 25) + '%';
        p.style.animationDelay = (i * 0.08) + 's';
        stage.appendChild(p);
        setTimeout(() => p.remove(), 1200);
      }
    }

    // Отображение скина (основного или предпросмотра)
    function applyHamsterImage(skinId) {
      const sk = SKINS.find(x => x.id === skinId) || SKINS[0];
      const img = document.getElementById('hamsterImg');
      img.src = sk.file;
      img.onerror = function() {
        // Если файл конкретного скина ещё не загружен на GitHub — ставим базовый skin_suit.png
        if (!this.src.endsWith('skin_suit.png')) {
          this.src = 'skin_suit.png';
        }
      };
    }

    // Предпросмотр перед покупкой
    function previewSkin(id) {
      playSound('tap');
      previewSkinId = id;
      applyHamsterImage(id);

      const sk = SKINS.find(x => x.id === id);
      const banner = document.getElementById('previewBanner');
      const nameEl = document.getElementById('previewName');
      const btnEl = document.getElementById('previewActionBtn');

      const owned = state.owned.includes(id);
      const equipped = state.skin === id;

      if (equipped) {
        banner.classList.remove('active');
        previewSkinId = null;
      } else {
        banner.classList.add('active');
        nameEl.innerText = `Примерка: ${sk.name}`;
        btnEl.innerText = owned ? 'Надеть' : `Купить за ${sk.price} 🪙`;
      }
      renderActions();
    }

    function confirmSkinAction() {
      if (!previewSkinId) return;
      const sk = SKINS.find(x => x.id === previewSkinId);
      const owned = state.owned.includes(sk.id);

      if (owned) {
        state.skin = sk.id;
        previewSkinId = null;
        document.getElementById('previewBanner').classList.remove('active');
        playSound('tap');
        floatText(`Надет: ${sk.name}`);
        save(); renderActions();
      } else if (state.coins >= sk.price) {
        state.coins -= sk.price;
        state.owned.push(sk.id);
        state.skin = sk.id;
        previewSkinId = null;
        document.getElementById('previewBanner').classList.remove('active');
        playSound('coin');
        spawnParticles('✨', 7);
        floatText(`Куплено: ${sk.name}!`);
        save(); renderActions();
      } else {
        floatText(`Не хватает! Нужно ${sk.price} 🪙`);
      }
    }

    // ПЕРЕКЛЮЧЕНИЕ 6 ЛОКАЦИЙ (С ТВОИМИ ФОТОГРАФИЯМИ)
    let currentRoom = 'living';
    function setRoom(room, btn) {
      playSound('tap');
      currentRoom = room;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      // Если ушли из гардероба без покупки — возвращаем надетый скин
      if (room !== 'living' && previewSkinId) {
        previewSkinId = null;
        document.getElementById('previewBanner').classList.remove('active');
        applyHamsterImage(state.skin);
      }

      if (room !== 'bedroom') {
        state.sleeping = false;
        document.getElementById('sleepDim').classList.remove('active');
      }

      const stage = document.getElementById('stage');
      const badge = document.getElementById('roomBadge');

      const roomsConfig = {
        living:   { title: '🛋️ Гостиная', bg: "url('bg_living.jpg'), linear-gradient(180deg, #4b5563, #1f2937)" },
        kitchen:  { title: '🍔 Кухня',    bg: "url('bg_kitchen.jpg'), linear-gradient(180deg, #64748b, #334155)" },
        banya:    { title: '🧖 Баня',     bg: "url('bg_banya.jpg'), linear-gradient(180deg, #78350f, #451a03)" },
        bedroom:  { title: '🛏️ Спальня',  bg: "url('bg_bedroom.jpg'), url('bg_living.jpg'), linear-gradient(180deg, #1e1b4b, #0f172a)" },
        studio:   { title: '🎥 Блогинг',  bg: "url('bg_studio.jpg'), url('bg_living.jpg'), linear-gradient(180deg, #3b0764, #1e1b4b)" },
        football: { title: '⚽ Стадион',  bg: "url('bg_football.jpg'), linear-gradient(180deg, #15803d, #064e3b)" }
      };

      badge.innerText = roomsConfig[room].title;
      stage.style.backgroundImage = roomsConfig[room].bg;
      renderActions();
    }

    function renderActions() {
      const row = document.getElementById('actionsRow');
      row.innerHTML = '';

      if (currentRoom === 'living') {
        SKINS.forEach(s => {
          const owned = state.owned.includes(s.id);
          const eq = state.skin === s.id;
          const prev = previewSkinId === s.id;
          row.innerHTML += `
            <button class="act-btn ${eq ? 'active' : (prev ? 'previewing' : '')}" onclick="previewSkin('${s.id}')">
              <div class="act-emoji">${s.icon}</div>
              <div class="act-title">${s.name}</div>
              <div class="act-price">${eq ? '✅ Надет' : (prev ? '👁 Примерка' : (owned ? 'Надеть' : s.price + ' 🪙'))}</div>
            </button>`;
        });
      } else if (currentRoom === 'kitchen') {
        FOODS.forEach(f => {
          row.innerHTML += `
            <button class="act-btn" onclick="eatFood('${f.id}')">
              <div class="act-emoji">${f.icon}</div>
              <div class="act-title">${f.name}</div>
              <div class="act-price">${f.price === 0 ? 'Бесплатно' : f.price + ' 🪙'}</div>
            </button>`;
        });
      } else if (currentRoom === 'banya') {
        row.innerHTML = `
          <button class="act-btn" onclick="banyaSoap()"><div class="act-emoji">🧼</div><div class="act-title">Намылить</div><div class="act-price">Пена</div></button>
          <button class="act-btn" onclick="banyaRinse()"><div class="act-emoji">🚿</div><div class="act-title">Смыть водой</div><div class="act-price">100% чистота</div></button>
          <button class="act-btn" onclick="banyaSteam()"><div class="act-emoji">🪣</div><div class="act-title">Поддать пару</div><div class="act-price">${state.temp}°C</div></button>
          <button class="act-btn" onclick="banyaBroom()"><div class="act-emoji">🌿</div><div class="act-title">Веник</div><div class="act-price">+15% кайф</div></button>`;
      } else if (currentRoom === 'bedroom') {
        row.innerHTML = `
          <button class="act-btn ${state.sleeping ? 'active' : ''}" style="flex:1;" onclick="toggleSleep()">
            <div class="act-emoji">${state.sleeping ? '☀️' : '🌙'}</div>
            <div class="act-title">${state.sleeping ? 'Разбудить хомяка' : 'Выключить свет (Спать)'}</div>
            <div class="act-price">Восполняет бодрость</div>
          </button>`;
      } else if (currentRoom === 'studio') {
        row.innerHTML = `
          <button class="act-btn" style="flex:1;" onclick="makeVlog('TikTok', 25)"><div class="act-emoji">🎵</div><div class="act-title">Снять TikTok</div><div class="act-price">+25 🪙</div></button>
          <button class="act-btn" style="flex:1;" onclick="makeVlog('Reels', 40)"><div class="act-emoji">📸</div><div class="act-title">Снять Reels</div><div class="act-price">+40 🪙</div></button>`;
      } else if (currentRoom === 'football') {
        row.innerHTML = `
          <button class="act-btn active" style="flex:1;" onclick="playFootball()"><div class="act-emoji">⚽</div><div class="act-title">Выездной матч 11×11</div><div class="act-price">+150 🪙</div></button>
          <button class="act-btn" style="flex:1;" onclick="playCats()"><div class="act-emoji">🐱</div><div class="act-title">Убежать от кошек</div><div class="act-price">+60 🪙</div></button>`;
      }
    }

    function tapHamster() {
      if (state.sleeping) { floatText('💤 Тсс, хомяк спит...'); return; }
      playSound('tap');
      state.coins = +(state.coins + 0.2).toFixed(1);
      save();
      floatText('+0.2 🪙');
    }

    function eatFood(id) {
      const f = FOODS.find(x => x.id === id);
      if (state.coins < f.price) { floatText('Мало монет!'); return; }
      playSound('eat');
      state.coins -= f.price;
      state.hunger = Math.min(100, state.hunger + f.h);
      state.energy = Math.min(100, state.energy + f.e);

      const stage = document.getElementById('stage');
      const fly = document.createElement('div');
      fly.className = 'big-food-fly';
      fly.innerText = f.icon;
      stage.appendChild(fly);
      setTimeout(() => fly.remove(), 850);

      const img = document.getElementById('hamsterImg');
      img.style.transform = 'scaleX(1.16) scaleY(0.95)';
      setTimeout(() => { img.style.transform = 'scale(1)'; }, 650);

      save();
      floatText(f.id === 'air' ? '💨 Вдохнул воздух!' : `${f.icon} Ням! +${f.h}%`);
    }

    // АНИМАЦИИ И ЗВУКИ В БАНЕ
    function banyaSoap() {
      playSound('bubbles');
      document.getElementById('soapBubbles').classList.add('active');
      spawnParticles('🫧', 8);
      floatText('🧼 Намылили пеной!');
    }
    function banyaRinse() {
      playSound('bubbles');
      document.getElementById('soapBubbles').classList.remove('active');
      state.clean = 100;
      spawnParticles('💦', 8);
      save();
      floatText('🚿 Смыли пену! Чистота 100%');
    }
    function banyaSteam() {
      playSound('steam');
      state.temp = Math.min(115, state.temp + 10);
      const stage = document.getElementById('stage');
      const steam = document.createElement('div');
      steam.className = 'steam-fx';
      stage.appendChild(steam);
      setTimeout(() => steam.remove(), 1800);
      renderActions();
      floatText(`🌡️ Поддали пару! ${state.temp}°C`);
    }
    function banyaBroom() {
      playSound('tap');
      const box = document.getElementById('hamsterBox');
      box.classList.add('hamster-shake');
      setTimeout(() => box.classList.remove('hamster-shake'), 450);
      spawnParticles('🌿', 7);
      state.fun = Math.min(100, state.fun + 15);
      save();
      floatText('🌿 Попарились веником! +15% кайф');
    }

    let sleepTimer = null;
    function toggleSleep() {
      playSound('tap');
      state.sleeping = !state.sleeping;
      document.getElementById('sleepDim').classList.toggle('active', state.sleeping);
      clearInterval(sleepTimer);
      if (state.sleeping) {
        sleepTimer = setInterval(() => {
          state.energy = Math.min(100, state.energy + 4);
          spawnParticles('💤', 2);
          save();
        }, 1500);
      }
      renderActions();
    }

    function makeVlog(name, reward) {
      if (state.energy < 15) { floatText('⚡ Мало бодрости!'); return; }
      playSound('camera');
      const stage = document.getElementById('stage');
      const flash = document.createElement('div');
      flash.className = 'flash-fx';
      stage.appendChild(flash);
      setTimeout(() => flash.remove(), 500);

      spawnParticles('❤️', 7);
      state.energy -= 12; state.coins += reward; state.fun = Math.min(100, state.fun + 10);
      save();
      floatText(`🔴 REC ${name}: +${reward} 🪙`);
    }

    function playFootball() {
      if (state.energy < 15) { floatText('⚡ Устал! Поспи или выпей энергетик'); return; }
      playSound('whistle');
      spawnParticles('⚽', 8);
      state.coins += 150; state.fun = 100; state.energy -= 15;
      save();
      floatText('🏆 ГОЛ! Победа 3:1 (+150 🪙)');
    }

    function playCats() {
      playSound('coin');
      spawnParticles('🐱', 6);
      state.coins += 60; state.fun = Math.min(100, state.fun + 15);
      save();
      floatText('🏃 Убежал от кошек! +60 🪙');
    }

    // Lo-Fi плеер
    const tracks = ['lofi1.mp3', 'lofi2.mp3', 'lofi3.mp3'];
    let tIdx = 0, playing = false;
    const audio = new Audio();
    audio.loop = true;
    function toggleMusic() {
      playing = !playing;
      document.getElementById('playBtn').innerText = playing ? '⏸' : '▶️';
      if (playing) { audio.src = tracks[tIdx]; audio.play().catch(() => floatText('Загрузи lofi1.mp3 в репозиторий')); }
      else audio.pause();
    }
    function prevTrack() { tIdx = (tIdx + 2) % 3; document.getElementById('trackTxt').innerText = 'lofi' + (tIdx + 1); if (playing) { audio.src = tracks[tIdx]; audio.play().catch(()=>{}); } }
    function nextTrack() { tIdx = (tIdx + 1) % 3; document.getElementById('trackTxt').innerText = 'lofi' + (tIdx + 1); if (playing) { audio.src = tracks[tIdx]; audio.play().catch(()=>{}); } }

    // Старт
    applyHamsterImage(state.skin);
    updateUI();
    renderActions();
  </script>
</body>
</html>
