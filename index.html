<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamster Pou 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
    body { background: #111; overflow: hidden; height: 100vh; width: 100vw; color: #fff; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* UI Overlay */
    .ui-layer { position: absolute; z-index: 10; width: 100%; pointer-events: none; }
    .top-bar { top: 0; display: flex; justify-content: space-between; padding: 10px; background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent); }
    .coins { background: rgba(30,30,30,0.8); padding: 5px 12px; border-radius: 15px; font-weight: bold; color: #ffd166; border: 1px solid #f4a261; pointer-events: auto; }
    
    .stats-container { position: absolute; top: 50px; width: 100%; display: flex; justify-content: center; gap: 10px; padding: 0 10px; pointer-events: auto; }
    .stat-bar { background: rgba(0,0,0,0.6); padding: 5px; border-radius: 8px; font-size: 10px; width: 22%; border: 1px solid rgba(255,255,255,0.2); }
    .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-top: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: #52b788; transition: width 0.3s; }
    
    .bottom-panel { position: absolute; bottom: 0; width: 100%; background: rgba(20,20,25,0.9); border-top: 1px solid #444; padding: 10px; pointer-events: auto; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(5px); }
    .controls-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .controls-scroll::-webkit-scrollbar { height: 4px; }
    .controls-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    
    .btn { background: #333; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 10px; white-space: nowrap; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 80px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    .btn.active { border-color: #f4a261; background: rgba(244, 162, 97, 0.2); }
    
    .nav-tabs { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 10px; }
    .nav-btn { background: none; border: none; color: #aaa; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-btn.active { color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
    .nav-btn span { font-size: 18px; }

    #toast { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #f4a261; padding: 8px 15px; border-radius: 20px; font-size: 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI СЛОЙ -->
  <div class="ui-layer top-bar">
    <div class="coins">🪙 <span id="ui-coins">0</span></div>
    <div class="coins" id="ui-room-title">🛋️ Гостиная</div>
  </div>

  <div class="ui-layer stats-container">
    <div class="stat-bar">🍔 Сытость<div class="bar-bg"><div class="bar-fill" id="bar-hunger"></div></div></div>
    <div class="stat-bar">⚡ Бодрость<div class="bar-bg"><div class="bar-fill" id="bar-energy"></div></div></div>
    <div class="stat-bar">🧼 Чистота<div class="bar-bg"><div class="bar-fill" id="bar-clean"></div></div></div>
    <div class="stat-bar">💜 Кайф<div class="bar-bg"><div class="bar-fill" id="bar-fun"></div></div></div>
  </div>

  <div id="toast"></div>

  <div class="ui-layer bottom-panel">
    <div class="controls-scroll" id="action-panel">
      <!-- Кнопки действий генерируются через JS -->
    </div>
    
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchRoom('living')"><span>🛋️</span>Гостиная</button>
      <button class="nav-btn" onclick="switchRoom('kitchen')"><span>🍔</span>Кухня</button>
      <button class="nav-btn" onclick="switchRoom('banya')"><span>🧖</span>Баня</button>
      <button class="nav-btn" onclick="switchRoom('bedroom')"><span>🛏️</span>Спальня</button>
      <button class="nav-btn" onclick="switchRoom('studio')"><span>🎥</span>Блогинг</button>
      <button class="nav-btn" onclick="switchRoom('football')"><span>⚽</span>Футбол</button>
    </div>
  </div>

<script>
// ==========================================
// 1. ИГРОВЫЕ ДАННЫЕ И ТАМАГОЧИ ЛОГИКА
// ==========================================
let state = JSON.parse(localStorage.getItem('hamster3d_save')) || {
  coins: 500, hunger: 80, energy: 90, clean: 70, fun: 80,
  skin: 'naked', ownedSkins: ['naked'], sleeping: false
};

const SKINS = [
  { id: 'naked', name: 'Голый', price: 0 },
  { id: 'cap', name: 'Кепка', price: 15 },
  { id: 'paris', name: 'Paris', price: 35 },
  { id: 'profimatika', name: 'Профиматика', price: 45 },
  { id: 'ronaldo', name: 'Роналду #7', price: 65 },
  { id: 'riana_bulat', name: 'Риана+Булат', price: 80 },
  { id: 'bzelk', name: 'bzelk (Цепь)', price: 150 },
  { id: 'classic_suit', name: 'Костюм (Фото)', price: 320 },
  { id: 'business_suit', name: 'VIP Графит', price: 480 },
  { id: 'brown_tux', name: 'Смокинг', price: 700 }
];

const FOODS = [
  { id: 'air', name: 'Воздух', price: 0, val: 0 },
  { id: 'cheese', name: 'Бутер', price: 2, val: 14 },
  { id: 'pizza', name: 'Пицца', price: 7, val: 38 },
  { id: 'shavuha', name: 'Шавуха', price: 8, val: 48 },
  { id: 'monster', name: 'Монстер', price: 7, val: 55, isEnergy: true }
];

function saveState() {
  localStorage.setItem('hamster3d_save', JSON.stringify(state));
  updateUI();
}

function updateUI() {
  document.getElementById('ui-coins').innerText = Math.floor(state.coins);
  document.getElementById('bar-hunger').style.width = state.hunger + '%';
  document.getElementById('bar-energy').style.width = state.energy + '%';
  document.getElementById('bar-clean').style.width = state.clean + '%';
  document.getElementById('bar-fun').style.width = state.fun + '%';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2000);
}

// ==========================================
// 2. ДВИЖОК THREE.JS (СЦЕНА, СВЕТ, КАМЕРА)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);
scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5, 12);
camera.lookAt(0, 3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Освещение (дает 3D-объем и тени)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 15, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// ==========================================
// 3. СОЗДАНИЕ 3D ХОМЯКА И ОДЕЖДЫ
// ==========================================
const hamsterGroup = new THREE.Group();
scene.add(hamsterGroup);

// Генератор текстур для футболок с надписями
function createTextTexture(text, bgColor, textColor, extraText = '') {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, 512, 256);
  ctx.fillStyle = textColor;
  ctx.font = 'bold 60px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 256, 120);
  if(extraText) {
    ctx.font = '40px sans-serif';
    ctx.fillText(extraText, 256, 180);
  }
  return new THREE.CanvasTexture(canvas);
}

// Материалы
const furMat = new THREE.MeshStandardMaterial({ color: 0xd9822b, roughness: 0.8 });
const cheekMat = new THREE.MeshStandardMaterial({ color: 0xfff3e0, roughness: 0.9 });
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
const noseMat = new THREE.MeshStandardMaterial({ color: 0xf2949c });

// Тело и Голова
const body = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 32), furMat);
body.position.y = 2;
body.castShadow = true;
hamsterGroup.add(body);

// Щеки (Пухлые)
const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), cheekMat);
cheekL.position.set(-1, 2.2, 1.6);
hamsterGroup.add(cheekL);
const cheekR = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), cheekMat);
cheekR.position.set(1, 2.2, 1.6);
hamsterGroup.add(cheekR);

// Глаза
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), eyeMat);
eyeL.position.set(-0.6, 2.8, 1.85);
hamsterGroup.add(eyeL);
const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), eyeMat);
eyeR.position.set(0.6, 2.8, 1.85);
hamsterGroup.add(eyeR);

// Нос
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), noseMat);
nose.position.set(0, 2.5, 2.1);
hamsterGroup.add(nose);

// Уши
const earL = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), furMat);
earL.position.set(-1.2, 3.5, 0.5);
hamsterGroup.add(earL);
const earR = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), furMat);
earR.position.set(1.2, 3.5, 0.5);
hamsterGroup.add(earR);

// Слой одежды (Надевается поверх тела)
let clothingMesh = null;
let accessories = new THREE.Group();
hamsterGroup.add(accessories);

function applySkin() {
  if(clothingMesh) { hamsterGroup.remove(clothingMesh); clothingMesh = null; }
  accessories.clear();

  const skin = state.skin;
  if(skin === 'naked') return;

  const clothesGeo = new THREE.CylinderGeometry(2.05, 2.05, 2.5, 32);
  let clothesMat = new THREE.MeshStandardMaterial({color: 0xffffff});

  if (skin === 'paris') clothesMat = new THREE.MeshStandardMaterial({map: createTextTexture('PARIS', '#111', '#fff')});
  if (skin === 'profimatika') clothesMat = new THREE.MeshStandardMaterial({map: createTextTexture('ПРОФИМАТИКА', '#1d4ed8', '#fff')});
  if (skin === 'ronaldo') clothesMat = new THREE.MeshStandardMaterial({map: createTextTexture('RONALDO', '#b91c1c', '#fde047', '7')});
  if (skin === 'riana_bulat') clothesMat = new THREE.MeshStandardMaterial({map: createTextTexture('Риана+Булат', '#fff', '#e11d48', '❤️❤️❤️')});
  
  if (skin === 'bzelk') {
    clothesMat = new THREE.MeshStandardMaterial({map: createTextTexture('bzelk', '#0f172a', '#38bdf8')});
    // 3D Очки
    const glasses = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 0.2), new THREE.MeshStandardMaterial({color: 0x000000}));
    glasses.position.set(0, 2.8, 2.0);
    accessories.add(glasses);
    // Золотая цепь
    const chain = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.1, 16, 32), new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.8, roughness: 0.2}));
    chain.position.set(0, 1.5, 0);
    chain.rotation.x = Math.PI/2;
    accessories.add(chain);
  }
  
  if (skin === 'classic_suit') {
    // Синий пиджак с галстуком (Имитация текстурой)
    clothesMat = new THREE.MeshStandardMaterial({map: createTextTexture('👔', '#1a2c42', '#fff', '====')});
    const hat = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 32), new THREE.MeshStandardMaterial({color: 0x1a2c42}));
    hat.position.set(0, 4, 0);
    accessories.add(hat);
  }
  
  if (skin === 'business_suit') clothesMat = new THREE.MeshStandardMaterial({color: 0x222222});
  if (skin === 'brown_tux') clothesMat = new THREE.MeshStandardMaterial({color: 0x4a2c18});
  if (skin === 'cap') {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.8, 32), new THREE.MeshStandardMaterial({color: 0xe63946}));
    cap.position.set(0, 3.8, 0);
    const visor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 1.5), new THREE.MeshStandardMaterial({color: 0x9d0208}));
    visor.position.set(0, 3.5, 0.8);
    accessories.add(cap); accessories.add(visor);
    return; // Кепка без футболки
  }

  clothingMesh = new THREE.Mesh(clothesGeo, clothesMat);
  clothingMesh.position.y = 1.2;
  hamsterGroup.add(clothingMesh);
}

// ==========================================
// 4. ГЕНЕРАТОР КОМНАТ (МЕБЕЛЬ И ФОНЫ)
// ==========================================
const roomGroup = new THREE.Group();
scene.add(roomGroup);

let currentRoom = 'living';

function buildRoom(type) {
  roomGroup.clear();
  document.getElementById('ui-room-title').innerText = type.toUpperCase();
  
  // Пол
  const floorGeo = new THREE.PlaneGeometry(50, 50);
  let floorMat = new THREE.MeshStandardMaterial({color: 0x3d2c47});
  
  if(type === 'living') floorMat.color.setHex(0x3d2c47);
  if(type === 'kitchen') floorMat.color.setHex(0x3b4e58);
  if(type === 'banya') floorMat.color.setHex(0x5e3c23);
  if(type === 'bedroom') floorMat.color.setHex(0x1b1730);
  if(type === 'football') floorMat.color.setHex(0x15803d); // Трава
  
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  roomGroup.add(floor);

  // Мебель в зависимости от комнаты
  if(type === 'living') {
    // 3D Диван сзади
    const sofa = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 3), new THREE.MeshStandardMaterial({color: 0x6b21a8}));
    sofa.position.set(0, 1, -4);
    sofa.castShadow = true; sofa.receiveShadow = true;
    roomGroup.add(sofa);
  } 
  else if(type === 'kitchen') {
    // Стол
    const table = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 4), new THREE.MeshStandardMaterial({color: 0x8b4513}));
    table.position.set(0, 2, -4);
    table.castShadow = true;
    roomGroup.add(table);
  }
  else if(type === 'banya') {
    // Полки и печь
    const bench = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 3), new THREE.MeshStandardMaterial({color: 0xd2b48c}));
    bench.position.set(0, 1.5, -4);
    roomGroup.add(bench);
    const stove = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), new THREE.MeshStandardMaterial({color: 0x333333}));
    stove.position.set(4, 2, -4);
    roomGroup.add(stove);
  }
  else if(type === 'football') {
    // Футбольные ворота
    const goal = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 0.5), new THREE.MeshStandardMaterial({color: 0xffffff, wireframe: true}));
    goal.position.set(0, 2, -10);
    roomGroup.add(goal);
    // Мяч
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshStandardMaterial({color: 0xffffff}));
    ball.position.set(2, 0.5, -3);
    ball.castShadow = true;
    roomGroup.add(ball);
  }
}

// ==========================================
// 5. ИНТЕРАКТИВ И НАВИГАЦИЯ
// ==========================================
function switchRoom(room) {
  currentRoom = room;
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');
  
  buildRoom(room);
  renderActionPanel();
  
  if(room === 'football') {
    camera.position.set(0, 8, 18);
    camera.lookAt(0, 0, -5);
  } else {
    camera.position.set(0, 5, 12);
    camera.lookAt(0, 3, 0);
  }
}

function renderActionPanel() {
  const panel = document.getElementById('action-panel');
  panel.innerHTML = '';
  
  if(currentRoom === 'living') {
    SKINS.forEach(sk => {
      const isOwned = state.ownedSkins.includes(sk.id);
      const isEquipped = state.skin === sk.id;
      const btn = document.createElement('button');
      btn.className = `btn ${isEquipped ? 'active' : ''}`;
      btn.innerHTML = `<strong>${sk.name}</strong><span>${isEquipped ? 'Надет' : (isOwned ? 'Надеть' : sk.price+' 🪙')}</span>`;
      btn.onclick = () => {
        if(isOwned) { state.skin = sk.id; applySkin(); saveState(); renderActionPanel(); }
        else if(state.coins >= sk.price) {
          state.coins -= sk.price; state.ownedSkins.push(sk.id); state.skin = sk.id;
          applySkin(); saveState(); renderActionPanel(); showToast('Скин куплен!');
        } else { showToast('Мало монет!'); }
      };
      panel.appendChild(btn);
    });
  } 
  else if(currentRoom === 'kitchen') {
    FOODS.forEach(fd => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerHTML = `<strong>${fd.name}</strong><span>${fd.price} 🪙</span>`;
      btn.onclick = () => {
        if(state.coins >= fd.price) {
          state.coins -= fd.price;
          if(fd.isEnergy) state.energy = Math.min(100, state.energy + fd.val);
          else state.hunger = Math.min(100, state.hunger + fd.val);
          // Анимация щек
          cheekL.scale.set(1.5, 1.5, 1.5); cheekR.scale.set(1.5, 1.5, 1.5);
          setTimeout(() => { cheekL.scale.set(1,1,1); cheekR.scale.set(1,1,1); }, 500);
          saveState(); showToast('Ням-ням!');
        } else showToast('Мало монет!');
      };
      panel.appendChild(btn);
    });
  }
  else if(currentRoom === 'banya') {
    panel.innerHTML = `
      <button class="btn" onclick="state.clean = 100; saveState(); showToast('Помылись! 100% чистота');">🧼 Мыло</button>
      <button class="btn" onclick="showToast('Поддали жару! Температура 90°C');">🌡️ Пар</button>
    `;
  }
  else if(currentRoom === 'bedroom') {
    panel.innerHTML = `<button class="btn" onclick="state.sleeping = !state.sleeping; saveState(); showToast(state.sleeping?'Спим...':'Проснулись!');">🛏️ ${state.sleeping ? 'Разбудить' : 'Спать'}</button>`;
  }
  else if(currentRoom === 'football') {
    panel.innerHTML = `
      <button class="btn active" onclick="playFootball()">⚽ Играть матч (+150 🪙)</button>
      <button class="btn" onclick="playRunner()">🏃 Раннер 3D (+50 🪙)</button>
    `;
  }
}

function playFootball() {
  showToast('Гоооол! +150 монет');
  state.coins += 150; state.fun = 100; state.energy -= 20;
  saveState();
  // Прыжок хомяка от радости
  hamsterGroup.position.y = 3;
  setTimeout(() => hamsterGroup.position.y = 0, 300);
}
function playRunner() {
  showToast('Пробежал через кошек! +50 монет');
  state.coins += 50; state.fun += 10;
  saveState();
}

// Тап по хомяку через Raycaster (3D клик)
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
window.addEventListener('pointerdown', (e) => {
  if(e.clientY > window.innerHeight - 80 || e.clientY < 60) return; // Игнорим UI
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(body);
  if(intersects.length > 0) {
    state.coins += 1; state.fun = Math.min(100, state.fun + 1);
    saveState();
    hamsterGroup.scale.set(0.9, 0.9, 0.9);
    setTimeout(() => hamsterGroup.scale.set(1, 1, 1), 100);
  }
});

// ==========================================
// 6. АНИМАЦИЯ И РЕНДЕР
// ==========================================
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  
  // Дыхание хомяка
  if(!state.sleeping) {
    hamsterGroup.position.y = Math.sin(t * 3) * 0.1;
  } else {
    hamsterGroup.position.y = Math.sin(t * 1.5) * 0.05; // Медленное дыхание во сне
    dirLight.intensity = 0.2; // Выключаем свет
  }
  if(!state.sleeping) dirLight.intensity = 0.8;

  renderer.render(scene, camera);
}

// Инициализация
applySkin();
buildRoom('living');
renderActionPanel();
updateUI();
animate();

// Ресайз окна
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
